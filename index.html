<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Notes — Chapter-wise Study Guide</title>
    <meta name="description" content="Comprehensive AWS notes with chapter-wise navigation. Learn IAM, EC2, EBS, and more with hands-on guides.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ===== Top Navigation Bar ===== -->
    <nav class="topbar" id="topbar">
        <div class="topbar-left">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="topbar-brand">
                <span class="brand-icon">☁️</span>
                <span class="brand-text">AWS Notes</span>
            </div>
        </div>
        <div class="topbar-center" id="topbarChapterTitle"></div>
        <div class="topbar-right">
            <div class="theme-switcher" id="themeSwitcher">
                <button class="theme-btn active" data-theme="dark" aria-label="Dark mode" title="Dark Mode">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button class="theme-btn" data-theme="light" aria-label="Light mode" title="Light Mode">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
                <button class="theme-btn" data-theme="reading" aria-label="Reading mode" title="Reading Mode">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </button>
            </div>
            <button class="font-size-btn" id="fontSizeBtn" aria-label="Font size" title="Font Size">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            </button>
            <div class="font-size-popup" id="fontSizePopup">
                <span class="font-size-label">Font Size</span>
                <input type="range" id="fontSizeSlider" min="14" max="24" value="17" step="1">
                <span class="font-size-value" id="fontSizeValue">17px</span>
            </div>
        </div>
    </nav>

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">📑 Chapters</h2>
            <div class="chapter-count" id="chapterCount"></div>
        </div>
        <div class="sidebar-search">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="chapterSearch" placeholder="Search chapters..." autocomplete="off">
        </div>
        <nav class="chapter-list" id="chapterList" aria-label="Chapter navigation"></nav>
        <div class="sidebar-footer">
            <div class="progress-info">
                <span class="progress-label">Reading Progress</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </aside>

    <!-- ===== Sidebar Overlay (mobile) ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===== Main Content Area ===== -->
    <main class="main-content" id="mainContent">
        <!-- Welcome / Landing Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-hero">
                <div class="welcome-icon-ring">
                    <span class="welcome-icon">☁️</span>
                </div>
                <h1 class="welcome-title">AWS Notes</h1>
                <p class="welcome-subtitle">Chapter-wise Study Guide</p>
                <p class="welcome-desc">Master AWS services with structured, hands-on guides covering IAM, EC2, EBS, and more.</p>
            </div>

            <div class="stats-row" id="statsRow">
                <div class="stat-card">
                    <span class="stat-number" id="statChapters">0</span>
                    <span class="stat-label">Chapters</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="statTopics">0</span>
                    <span class="stat-label">Topic Areas</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="statHands">0</span>
                    <span class="stat-label">Hands-On Labs</span>
                </div>
            </div>

            <div class="topic-groups" id="topicGroups"></div>

            <p class="welcome-hint">👈 Select a chapter from the sidebar to begin reading</p>
        </div>

        <!-- Chapter Reading Area -->
        <article class="chapter-content" id="chapterContent" style="display: none;">
            <div class="chapter-header" id="chapterHeader">
                <div class="chapter-badge" id="chapterBadge"></div>
                <h1 class="chapter-title" id="chapterTitle"></h1>
            </div>
            <div class="chapter-body markdown-body" id="chapterBody"></div>
            <div class="chapter-nav" id="chapterNav">
                <button class="chapter-nav-btn prev" id="prevChapter" aria-label="Previous chapter">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    <div class="nav-btn-text">
                        <span class="nav-btn-label">Previous</span>
                        <span class="nav-btn-title" id="prevChapterTitle"></span>
                    </div>
                </button>
                <button class="chapter-nav-btn next" id="nextChapter" aria-label="Next chapter">
                    <div class="nav-btn-text">
                        <span class="nav-btn-label">Next</span>
                        <span class="nav-btn-title" id="nextChapterTitle"></span>
                    </div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>
        </article>

        <!-- Scroll-to-top Button -->
        <button class="scroll-top" id="scrollTopBtn" aria-label="Scroll to top">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
    </main>

    <script src="app.js"></script>
</body>
</html>
